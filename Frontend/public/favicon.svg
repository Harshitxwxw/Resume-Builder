<svg xmlns="http://www.w3.org/2000/svg" viewBox="8.5 10 80 80" width="80" height="80" fill="none">
  <defs>
    <!-- Upper Wing Ribbon Gradient (Cyan to Royal Blue to Indigo) -->
    <linearGradient id="careerAiUpper" x1="15%" y1="70%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Lower Wing Ribbon Gradient (Deep Royal to Vibrant Blue) -->
    <linearGradient id="careerAiLower" x1="15%" y1="30%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ribbon Fold Shadow / Depth -->
    <linearGradient id="careerAiFold" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0b1329" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>

    <!-- Star Radiant Gradient (Glowing Cyan to Blue) -->
    <linearGradient id="careerAiStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Star Glow Aura Filter -->
    <filter id="starAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.65  0 0 0 0 1  0 0 0 0.85 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Star -->
  <circle cx="60" cy="50" r="16" fill="#38bdf8" opacity="0.45" filter="url(#starAura)"/>

  <!-- Lower Wing Ribbon -->
  <path d="M 16 50 L 48 83 C 51 86 56 88 61 88 L 76 88 C 80 88 81 84 78 81 L 63 62 C 57 55 48 50 38 50 Z" 
        fill="url(#careerAiLower)"/>

  <!-- Upper Wing Ribbon -->
  <path d="M 16 50 L 48 17 C 51 14 56 12 61 12 L 76 12 C 80 12 81 16 78 19 L 63 38 C 57 45 48 50 38 50 Z" 
        fill="url(#careerAiUpper)"/>

  <!-- Ribbon Fold Depth & Shadow Overlap -->
  <path d="M 16 50 L 42 50 C 32 46 24 50 16 50 Z" fill="url(#careerAiFold)"/>

  <!-- Glowing Star in the Center Notch -->
  <path d="M 60 32.5 
           L 63.8 43.5 
           L 75.5 43.8 
           L 66.2 50.8 
           L 69.8 62 
           L 60 55.2 
           L 50.2 62 
           L 53.8 50.8 
           L 44.5 43.8 
           L 56.2 43.5 Z" 
        fill="url(#careerAiStar)" 
        filter="url(#starAura)"/>
</svg>
